name: CI

on:
  pull_request:
  push:
    branches: [main]
  # release.yml runs these checks before it builds and pushes an image
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit and API tests
        run: python -m unittest discover -s tests -v
      - name: Migrations apply to an empty database and match the models
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/ci.db
        run: |
          alembic upgrade head
          alembic check

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start OIDC provider (Dex)
        # Host network: browser and backend both reach the issuer as http://localhost:5556/dex
        run: |
          docker run -d --name dex --network host \
            -v "$PWD/e2e/oidc/dex.yaml:/etc/dex/config.yaml:ro" \
            ghcr.io/dexidp/dex:v2.46.1 dex serve /etc/dex/config.yaml
          for i in $(seq 1 60); do
            curl -fsS http://localhost:5556/dex/.well-known/openid-configuration > /dev/null && break
            sleep 1
          done
      - name: Start instance
        run: |
          # Mails and push notifications are written as files the tests read (MAIL_DIR, PUSH_DIR);
          # plans as in e2e/plans.json, with an unlimited default so other tests are not limited
          mkdir -m 777 /tmp/mail /tmp/push
          docker run -d --name app --network host -e PUBLIC_URL=http://localhost:8000 \
            -e OIDC_ISSUER=http://localhost:5556/dex -e OIDC_CLIENT_ID=fahrma \
            -e OIDC_CLIENT_SECRET=fahrma-e2e-secret -e OIDC_LABEL=Dex \
            -e REGISTRATION=open -e TERMS_URL=https://example.org/terms -e IMPRINT_URL=https://example.org/imprint \
            -e "MAIL_FROM=fahrma <noreply@example.org>" -e MAIL_DIR=/mail -v /tmp/mail:/mail \
            -e PUSH_DIR=/push -v /tmp/push:/push \
            -e PLANS_FILE=/config/plans.json -v "$PWD/e2e/plans.json:/config/plans.json:ro" \
            -e BILLING_URL=https://example.org/plans app:ci
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/api/health && break
            sleep 1
          done
          token=$(docker logs app 2>&1 | grep -E '^    [A-Za-z0-9_-]{20,}$' | tail -1 | tr -d ' ')
          test -n "$token"
          echo "::add-mask::$token"
          echo "E2E_SETUP_TOKEN=$token" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Run end-to-end tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8000
          E2E_MAIL_DIR: /tmp/mail
          E2E_PUSH_DIR: /tmp/push
          E2E_OIDC: "1"
        run: npx playwright test
      - name: Server log
        if: failure()
        run: docker logs app
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  upgrade:
    # A real update: an earlier release gets data, then this image starts on the same volume
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The oldest public release and the newest one before this commit
        from: ["0.3.0", latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: app:ci
          cache-from: type=gha
      - name: Upgrade from an earlier release
        env:
          FROM: ${{ matrix.from }}
        run: |
          if [ "$FROM" = latest ]; then
            # Tags on this commit are the release being built, which has no image yet
            FROM=$(git tag --list 'v[0-9]*' --no-contains HEAD | grep -v -e - | sed 's/^v//' | sort -V | tail -1)
          fi
          test -n "$FROM"
          echo "Upgrading from $FROM"
          e2e/upgrade/run.sh "ghcr.io/percuro/fahrma:$FROM" app:ci

  private-terms:
    # Guards against personal data (domains, names, hosts) slipping into the repository.
    # The terms live in the PRIVATE_TERMS secret (one per line), never in the repo.
    # Forks and pull requests from forks have no access to it and skip the check.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Search tracked files for private terms
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: |
          if [ -z "$PRIVATE_TERMS" ]; then
            echo "PRIVATE_TERMS not available, skipping"
            exit 0
          fi
          printf '%s\n' "$PRIVATE_TERMS" | sed '/^[[:space:]]*$/d' > "$RUNNER_TEMP/terms"
          if git grep -n -i -w -F -f "$RUNNER_TEMP/terms" -- . ; then
            echo "::error::Private terms found in tracked files (see above)"
            exit 1
          fi
          echo "No private terms found"
